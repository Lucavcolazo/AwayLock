# Corre los tests y compila la app en cada push a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: swift test

      - name: Compilar la app (universal)
        run: ./build.sh
